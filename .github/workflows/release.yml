name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  GOWORK: "off"
  PNPM_VERSION: 11.18.0

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require a semantic version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Verify release tag signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tag must be an annotated, signed tag" >&2
            exit 1
          fi

          tag_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          verified="$(gh api "repos/${GH_REPO}/git/tags/${tag_sha}" --jq '.verification.verified')"
          reason="$(gh api "repos/${GH_REPO}/git/tags/${tag_sha}" --jq '.verification.reason')"

          if [[ "$verified" != "true" ]]; then
            echo "GitHub did not verify the release tag signature: ${reason}" >&2
            exit 1
          fi

          echo "GitHub verified the release tag signature"

  quality:
    needs: validate
    uses: ./.github/workflows/quality.yml

  build:
    name: Build ${{ matrix.name }}
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WAILS_PUREGO: "1"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve Wails version
        id: wails-version
        shell: bash
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" >> "$GITHUB_OUTPUT"

      - name: Install Wails CLI
        shell: bash
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ steps.wails-version.outputs.version }}"

      - name: Build application
        shell: bash
        run: wails3 build VERSION="${GITHUB_REF_NAME#v}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          os="$(go env GOOS)"
          arch="$(go env GOARCH)"
          package_dir="$(mktemp -d)"
          install -m 0755 bin/telesma "${package_dir}/telesma"
          tar -C "${package_dir}" -czf "dist/telesma-${os}-${arch}.tar.gz" telesma

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force package | Out-Null
          $arch = go env GOARCH
          Copy-Item bin/telesma.exe package/telesma.exe
          Compress-Archive -Path package/telesma.exe -DestinationPath "dist/telesma-windows-$arch.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telesma-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/telesma-*.tar.gz
            dist/telesma-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum telesma-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
